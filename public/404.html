<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — File Not Found | Michael OMale</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;600&display=swap');
      * { margin: 0; box-sizing: border-box; padding: 0; }
      body {
        background: #0F172A; color: #fff;
        font-family: 'JetBrains Mono', monospace;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 2rem;
      }
      .container {
        max-width: 600px; text-align: center;
      }
      h1 {
        font-family: 'Archivo Black', sans-serif;
        font-size: clamp(3rem, 10vw, 6rem);
        color: #FFD500; letter-spacing: -0.02em;
        margin-bottom: 1rem;
      }
      .badge {
        display: inline-block;
        background: #FFD500; color: #000;
        padding: 0.25rem 0.75rem;
        font-size: 0.75rem; font-weight: 600;
        letter-spacing: 0.15em; margin-bottom: 1.5rem;
        border: 3px solid #000;
        box-shadow: 4px 4px 0 #000;
      }
      p {
        font-size: 0.875rem; line-height: 1.7;
        color: rgba(255,255,255,0.5); margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        font-family: 'Archivo Black', sans-serif;
        font-size: 0.8rem; letter-spacing: 0.08em;
        color: #000; background: #FFD500;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border: 3px solid #000;
        box-shadow: 6px 6px 0 #000;
        transition: box-shadow 0.15s ease, transform 0.15s ease;
      }
      a:hover { box-shadow: 2px 2px 0 #000; transform: translate(4px, 4px); }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">// ERROR 404</div>
      <h1>NOT FOUND</h1>
      <p>
        The file you're looking for doesn't exist in this dossier.<br />
        It may have been moved, deleted, or classified.
      </p>
      <p>
        <span style="color: #FFD500;">&gt;</span> Return to base <span class="cursor">_</span>
      </p>
      <a href="/">← BACK TO PORTFOLIO</a>
    </div>
  </body>
</html>
